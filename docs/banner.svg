  <text x="64" y="140" fill="#C9E0FB" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20">真实面经统计 → AI 出题 / 模拟面试 → 量化复盘，让每次练习都有数据依据</text>

